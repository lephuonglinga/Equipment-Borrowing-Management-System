<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu mượn — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/borrow-cart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/borrow.js"></script>
</head>
<body>

    <div id="siteHeader"></div>

    <div class="page-wrap wide">
        <div class="card card-accent">
            <div class="page-header">
                <div>
                    <h1 id="pageTitle">Yêu cầu mượn</h1>
                    <p class="subtitle" id="pageSubtitle">Theo dõi trạng thái các yêu cầu mượn thiết bị.</p>
                </div>
                <a href="equipment.html" class="btn btn-primary btn-sm" id="btnBorrowMore" style="width:auto;">
                    <i class="fa-solid fa-plus"></i> Mượn thêm
                </a>
            </div>

            <div id="listAlert" style="display:none;"></div>

            <div class="tab-bar" id="borrowTabs">
                <button type="button" class="tab-btn active" data-tab="pending" id="tabPending">Chờ duyệt</button>
                <button type="button" class="tab-btn" data-tab="pickup" id="tabPickup">Chờ bàn giao</button>
                <button type="button" class="tab-btn" data-tab="active" id="tabActive">Đang mượn</button>
                <button type="button" class="tab-btn" data-tab="history" id="tabHistory">Lịch sử</button>
            </div>

            <div id="borrowList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Chi tiết yêu cầu #<span id="detailId"></span></h2>
                <button type="button" class="modal-close" data-close>&times;</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
            <div class="modal-footer" id="detailActions"></div>
        </div>
    </div>

</body>
</html>
