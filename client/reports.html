<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
</head>
<body>

    <div id="siteHeader"></div>

    <div class="page-wrap wide">
        <div class="card card-accent">
            <div class="page-header">
                <div>
                    <h1>Báo cáo</h1>
                    <p class="subtitle">Dashboard và thống kê mượn thiết bị (Staff / Admin).</p>
                </div>
            </div>

            <div id="reportAlert" style="display:none;"></div>
            <div id="dashboardStats"></div>

            <div class="section-title">Tóm tắt mượn theo khoảng ngày</div>
            <form id="summaryForm" class="toolbar-row">
                <div class="form-group">
                    <label for="fromDate">Từ ngày</label>
                    <input type="date" id="fromDate">
                </div>
                <div class="form-group">
                    <label for="toDate">Đến ngày</label>
                    <input type="date" id="toDate">
                </div>
                <div class="form-group" style="flex:0;">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-primary btn-sm">Xem</button>
                </div>
            </form>
            <div id="borrowSummary"></div>

            <div class="section-title">Yêu cầu quá hạn</div>
            <div id="overdueTable" class="data-table-wrap"></div>
        </div>
    </div>

</body>
</html>
