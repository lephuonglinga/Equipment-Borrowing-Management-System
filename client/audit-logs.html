<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit-logs.js"></script>
</head>
<body>

    <div id="siteHeader"></div>

    <div class="page-wrap wide">
        <div class="card card-accent">
            <div class="page-header">
                <div>
                    <h1>Audit Logs</h1>
                    <p class="subtitle">Lịch sử thay đổi hệ thống (Admin).</p>
                </div>
            </div>

            <form id="filterForm" class="toolbar-row">
                <div class="form-group">
                    <label for="entityName">Entity</label>
                    <input type="text" id="entityName" placeholder="Equipment, User...">
                </div>
                <div class="form-group">
                    <label for="action">Action</label>
                    <input type="text" id="action" placeholder="Create, Update...">
                </div>
                <div class="form-group" style="flex:0;">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-primary btn-sm">Lọc</button>
                </div>
            </form>

            <div id="auditTableWrap" class="data-table-wrap"></div>
            <div id="auditPager"></div>
        </div>
    </div>

</body>
</html>
