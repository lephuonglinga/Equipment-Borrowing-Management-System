<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/manage.js"></script>
</head>
<body>

    <div id="siteHeader"></div>

    <div class="page-wrap wide manage-page">
        <div class="card card-accent">
            <div class="page-header">
                <div>
                    <h1>Quản lý</h1>
                    <p class="subtitle">CRUD thiết bị và danh mục (Staff / Admin).</p>
                </div>
            </div>

            <div class="tab-bar">
                <button type="button" class="tab-btn active" data-tab="equipment">Thiết bị</button>
                <button type="button" class="tab-btn" data-tab="categories">Danh mục</button>
            </div>

            <div id="pageAlert" style="display:none;"></div>

            <!-- Equipment tab -->
            <div class="tab-panel active" id="tab-equipment">
                <div class="toolbar-row">
                    <button type="button" class="btn btn-primary btn-sm" id="btnAddEquipment">
                        <i class="fa-solid fa-plus"></i> Thêm thiết bị
                    </button>
                    <select id="eqFilterStatus" class="filter-select" title="Lọc trạng thái">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Available">Available</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Lost">Lost</option>
                        <option value="Borrowed">Borrowed</option>
                        <option value="Reserved">Reserved</option>
                        <option value="Retired">Retired</option>
                    </select>
                    <select id="eqFilterCondition" class="filter-select" title="Lọc tình trạng">
                        <option value="">Tất cả tình trạng</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Damaged">Damaged</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <div id="equipmentTableWrap" class="data-table-wrap"></div>
                <div id="equipmentPager"></div>
            </div>

            <!-- Categories tab -->
            <div class="tab-panel" id="tab-categories">
                <div class="toolbar-row">
                    <button type="button" class="btn btn-primary btn-sm" id="btnAddCategory">
                        <i class="fa-solid fa-plus"></i> Thêm danh mục
                    </button>
                </div>
                <div id="categoryTableWrap" class="data-table-wrap"></div>
            </div>
        </div>
    </div>

    <!-- Equipment modal -->
    <div class="modal-overlay" id="equipmentModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="equipmentModalTitle">Thiết bị</h2>
                <button type="button" class="modal-close" data-close>&times;</button>
            </div>
            <form id="equipmentForm">
                <div class="modal-body">
                    <input type="hidden" id="eqId">
                    <div id="eqAlert" style="display:none;"></div>
                    <div class="form-group">
                        <label for="eqName">Tên</label>
                        <input type="text" id="eqName" required>
                    </div>
                    <div class="form-group">
                        <label for="eqSerial">Serial</label>
                        <input type="text" id="eqSerial" required>
                    </div>
                    <div class="form-group">
                        <label for="eqCategory">Danh mục</label>
                        <select id="eqCategory" required></select>
                    </div>
                    <div class="form-group" id="eqStatusGroup" style="display:none;">
                        <label for="eqStatus">Trạng thái</label>
                        <select id="eqStatus">
                            <option value="Available">Available</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Retired">Retired</option>
                        </select>
                        <p class="form-hint">Borrowed / Reserved / Lost do luồng mượn quản lý.</p>
                    </div>
                    <div class="form-group" id="eqConditionGroup" style="display:none;">
                        <label for="eqCurrentCondition">Tình trạng</label>
                        <select id="eqCurrentCondition">
                            <option value="Good">Good</option>
                            <option value="Fair">Fair</option>
                            <option value="Damaged">Damaged</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="eqLocation">Vị trí</label>
                        <input type="text" id="eqLocation">
                    </div>
                    <div class="form-group">
                        <label for="eqDescription">Mô tả</label>
                        <textarea id="eqDescription" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="eqImageUrl">Image URL</label>
                        <input type="url" id="eqImageUrl" placeholder="https://...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category modal -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="categoryModalTitle">Danh mục</h2>
                <button type="button" class="modal-close" data-close>&times;</button>
            </div>
            <form id="categoryForm">
                <div class="modal-body">
                    <input type="hidden" id="catId">
                    <div id="catAlert" style="display:none;"></div>
                    <div class="form-group">
                        <label for="catName">Tên</label>
                        <input type="text" id="catName" required>
                    </div>
                    <div class="form-group">
                        <label for="catDescription">Mô tả</label>
                        <textarea id="catDescription" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
