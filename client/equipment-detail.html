<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết thiết bị — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/borrow-cart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/equipment-detail.js"></script>
</head>
<body>

    <div id="siteHeader"></div>

    <div class="page-wrap equipment-page">
        <div class="card card-accent">
            <a href="equipment.html" class="back-link detail-back" id="backLink">
                <i class="fa-solid fa-arrow-left"></i> Quay lại Equipments
            </a>

            <div id="detailAlert" style="display:none;"></div>
            <div id="detailContent">
                <p class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</p>
            </div>
        </div>
    </div>

    <div id="borrowCartBar" class="borrow-cart-bar" style="display:none;">
        <span id="cartSummary">Đã chọn 0 thiết bị</span>
        <div class="borrow-cart-bar-actions">
            <button type="button" class="btn btn-cart-clear" id="btnClearCart">Hủy tất cả</button>
            <button type="button" class="btn btn-register-borrow" id="btnRegisterBorrow">Đăng ký mượn</button>
        </div>
    </div>

    <div class="modal-overlay" id="confirmBorrowModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Xác nhận đăng ký mượn</h2>
                <button type="button" class="modal-close" data-close>&times;</button>
            </div>
            <form id="confirmBorrowForm">
                <div class="modal-body">
                    <div id="confirmAlert" style="display:none;"></div>
                    <div class="section-title" style="margin-top:0;">Thiết bị đã chọn</div>
                    <ul id="confirmItemList" class="item-list"></ul>
                    <div class="form-group">
                        <label for="borrowDate">Ngày mượn</label>
                        <input type="date" id="borrowDate" required>
                    </div>
                    <div class="form-group">
                        <label for="expectedReturnDate">Ngày trả dự kiến</label>
                        <input type="date" id="expectedReturnDate" required>
                    </div>
                    <div class="form-group">
                        <label for="purpose">Mục đích</label>
                        <textarea id="purpose" rows="3" required placeholder="Mô tả mục đích mượn..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary btn-fit">Gửi yêu cầu</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
