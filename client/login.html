<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — EBMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="auth-page">

    <div class="auth-shell">
        <aside class="auth-brand">
            <div class="logo-mark"><i class="fa-solid fa-toolbox"></i></div>
            <h2>Equipment Borrowing Management</h2>
            <p>Hệ thống quản lý mượn — trả thiết bị. Đăng nhập để tiếp tục.</p>
            <ul class="feature-list">
                <li><i class="fa-solid fa-microscope"></i> Tra cứu thiết bị Available</li>
                <li><i class="fa-solid fa-clipboard-list"></i> Tạo yêu cầu mượn (Borrow Request)</li>
                <li><i class="fa-solid fa-bell"></i> Nhận thông báo trạng thái</li>
            </ul>
        </aside>

        <main class="auth-main">
            <div class="auth-topbar">
                <a href="login.html" class="active">Đăng nhập</a>
                <a href="register.html">Đăng ký</a>
            </div>

            <div class="auth-content">
                <div class="card auth-card">
                    <div class="card-header">
                        <h1>Đăng nhập</h1>
                        <p class="subtitle">Nhập email và mật khẩu tài khoản của bạn.</p>
                    </div>

                    <div id="alertBox" style="display:none;"></div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required placeholder="user@ebms.local" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">Mật khẩu</label>
                            <input type="password" id="password" required placeholder="Nhập mật khẩu" autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary" id="btnLogin">Đăng nhập</button>
                    </form>

                    <div class="form-footer">
                        Chưa có tài khoản?<a href="register.html">Đăng ký</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function () {
            if (getAuth()) {
                window.location.href = "home.html";
                return;
            }

            $("#loginForm").on("submit", function (e) {
                e.preventDefault();
                const $alert = $("#alertBox");
                $alert.hide();

                const $btn = $("#btnLogin");
                $btn.prop("disabled", true).text("Đang xử lý...");

                apiRequest({
                    url: "/api/auth/login",
                    method: "POST",
                    body: {
                        email: $("#email").val().trim(),
                        password: $("#password").val()
                    }
                })
                .done(function (data) {
                    saveAuth(data);
                    window.location.href = "home.html";
                })
                .fail(function (xhr) {
                    $alert
                        .removeClass("alert-success")
                        .addClass("alert alert-error")
                        .html('<i class="fa-solid fa-circle-exclamation"></i><span>' + getErrorMessage(xhr) + '</span>')
                        .show();
                })
                .always(function () {
                    $btn.prop("disabled", false).text("Đăng nhập");
                });
            });
        });
    </script>
</body>
</html>
